# Netlify Configuration for LaserMachine
# ==========================================

[build]
  # Build command for Vite
  command = "npm run build"
  # Output directory (Vite default)
  publish = "dist"

# Edge Functions configuration
[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# SPA redirect - all routes go to index.html (must be first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API routes go to Edge Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"