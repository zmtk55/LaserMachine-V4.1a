# Netlify Configuration for LaserMachine
# ==========================================

[build]
  # Build command for Vite
  command = "npm run build"
  # Output directory (Vite default)
  publish = "dist"
  # Functions directory (not used - we use Edge Functions)
  # functions = "netlify/functions"

# Edge Functions configuration
[functions]
  node_bundler = "esbuild"

# Environment variables (set these in Netlify Dashboard > Site Settings > Environment Variables)
# DATABASE_URL = "your-neon-connection-string"

# SPA redirect - all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin", "user", "guest"]}

# API routes go to Edge Function
[[edge_functions]]
  path = "/api/*"
  function = "api"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dev server configuration for local testing
[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5173
  autoLaunch = false
