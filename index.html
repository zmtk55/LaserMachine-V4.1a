
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LaserMachine - Operaciones Industriales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@700&family=Permanent+Marker&family=Bebas+Neue&family=Anton&display=swap" rel="stylesheet">
    <script>
      // Polyfill crítico para evitar que process.env rompa la app en navegadores
      window.process = window.process || { env: {} };
      window.process.env = window.process.env || {};
      if (!window.process.env.NODE_ENV) {
        window.process.env.NODE_ENV = 'development';
      }

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              yellow: { 400: '#facc15', 500: '#eab308' },
              zinc: { 
                800: '#27272a',
                900: '#18181b',
                950: '#09090b' 
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'], // Google Sans equivalent
              mono: ['JetBrains Mono', 'monospace'],
              display: ['Plus Jakarta Sans', 'sans-serif'], // Unified brand font
              vintage: ['Playfair Display', 'serif'],
            },
            letterSpacing: {
              tightest: '-0.05em',
              tighter: '-0.02em',
              normal: '0',
              wide: '0.02em',
              wider: '0.05em',
            },
            aspectRatio: {
              'product': '5 / 6',
            },
          },
        },
      }
    </script>
    <style>
      body {
        background: #09090b;
        color: #fafafa;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        font-family: 'Plus Jakarta Sans', sans-serif; /* Global Font Override */
      }
      
      .google-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .font-mono-tech {
        font-family: 'JetBrains Mono', monospace;
      }
      
      /* Clases de fuentes para el grabador (Visualizer) */
      .font-google { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-bold1 { font-family: 'Bebas Neue', sans-serif; }
      .font-industrial { font-family: 'Anton', sans-serif; letter-spacing: 0.05em; }
      .font-script1 { font-family: 'Permanent Marker', cursive; }
      .font-serif1 { font-family: 'Playfair Display', serif; }
      .font-display1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
      .font-script2 { font-family: 'Permanent Marker', cursive; font-style: italic; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .product-container {
        aspect-ratio: 5 / 6;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
        border: 1px solid #27272a;
      }
      
      .laser-engraved {
        filter: brightness(0.7) contrast(1.2);
        mix-blend-mode: overlay;
        opacity: 0.7;
      }

      .btn-primary {
        @apply bg-yellow-400 text-black font-bold uppercase tracking-wide transition-all active:scale-95 disabled:opacity-50;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
    "@imgly/background-removal": "https://esm.sh/@imgly/background-removal@1.4.5",
    "react-easy-crop": "https://esm.sh/react-easy-crop@5.0.4?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@0.2.1",
    "firebase/": "https://esm.sh/firebase@^12.8.0/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
